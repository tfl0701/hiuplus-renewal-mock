<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>80만원 강조 색 — 하이유플 결합 머리칸</title>
<style>
  :root { --ink:#1d1628; --g2:#3c3350; }
  * { box-sizing:border-box; }
  body { margin:0; background:#f4f4f6; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; }
  .num { font-variant-numeric:tabular-nums; }
  header { padding:26px 20px 18px; background:#fff; border-bottom:1px solid #ececec; }
  header h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:-.02em; }
  header p { margin:8px 0 0; font-size:14px; line-height:1.65; color:#666; }
  .wrap { padding:18px 16px 60px; display:flex; flex-direction:column; gap:24px; }
  .item { max-width:760px; margin:0 auto; width:100%; }
  .cap { display:flex; align-items:center; gap:8px; margin:0 0 8px; flex-wrap:wrap; }
  .cap b { font-size:15px; font-weight:700; }
  .cap code { font-size:12px; padding:2px 7px; border-radius:6px; background:#eee; color:#555; }
  .cap em { font-style:normal; font-size:12px; color:#777; }
  .cap .rec { font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; background:#e9e6ef; color:#5d4477; }

  /* 실제 머리칸 */
  .hd { padding:26px 22px 22px; border-radius:20px;
        background:linear-gradient(180deg,#ece6f3 0%,#dcd2e8 100%); }
  .eyebrow { margin:0; font-size:13px; font-weight:700; color:#6b5c86; }
  .hd h2 { margin:8px 0 0; font-size:25px; line-height:1.32; font-weight:700; letter-spacing:-.035em; }
  .lead { margin:10px 0 0; font-size:14px; line-height:1.7; color:var(--g2); }
  .hook { margin-top:18px; display:flex; align-items:center; gap:14px; padding:16px 18px;
          border-radius:16px; background:#fff; box-shadow:0 2px 10px rgba(60,40,90,.08); }
  .hook b { font-size:36px; line-height:1; font-weight:700; letter-spacing:-.03em; }
  .hook span { font-size:14px; line-height:1.5; color:#3c3645; }
  @media (min-width:900px){
    .top { display:grid; grid-template-columns:minmax(0,1fr) 320px; align-items:center; gap:32px; }
    .hook { margin-top:0; flex-direction:column; align-items:flex-start; gap:8px; padding:24px 26px; border-radius:20px; }
    .hook b { font-size:48px; }
  }
  footer { padding:0 20px 40px; text-align:center; font-size:12px; color:#9a9a9a; }
</style>
</head>
<body>
<header>
  <h1>「80만원」 강조 색</h1>
  <p>빨강 말고 눈에 띄는 색 넷입니다. 실제 머리칸(연보라 바탕 · 흰 칸) 위에 그대로 얹었습니다.<br>
     괄호 안은 흰 바탕에서 글자가 얼마나 또렷한지입니다. 4.5 이상이면 작은 글씨도 안전하고, 큰 숫자는 3 이상이면 됩니다.</p>
</header>
<div class="wrap">
</div>
<footer>시안 · 실제 화면이 아닙니다 · 2026-09-17</footer>
<script>
  var items = [
    ['지금 몰 분홍', '#e5287e', '4.25', ''],
    ['짙은 남색',   '#1B3A8F', '10.25', '가장 또렷합니다. 믿음직한 느낌이고 분홍과 확실히 갈립니다.'],
    ['진보라',     '#6B3FA0', '7.38', '바탕 연보라와 같은 계열이라 가장 잘 어울립니다.'],
    ['청록',       '#0F6E78', '5.96', '차분하면서 눈에 띕니다. 우리 화면에 없던 색이라 새로 보입니다.'],
    ['진한 초록',   '#0B7A54', '5.35', '돈·할인에서 흔히 쓰는 색이라 「이득」으로 바로 읽힙니다.']
  ];
  var wrap = document.querySelector('.wrap');
  items.forEach(function (it, i) {
    var name = it[0], hex = it[1], cr = it[2], why = it[3];
    var d = document.createElement('div');
    d.className = 'item';
    d.innerHTML =
      '<p class="cap"><b>' + name + '</b><code>' + hex + '</code><em>대비 ' + cr + '</em>' +
      (i === 0 ? '<em>— 지금 쓰는 색</em>' : '') + (i === 1 ? '<span class="rec">추천</span>' : '') + '</p>' +
      (why ? '<p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#666;">' + why + '</p>' : '') +
      '<div class="hd"><div class="top"><div>' +
        '<p class="eyebrow">휴대폰 + 인터넷</p>' +
        '<h2>휴대폰만 묶어도 할인돼요<br>인터넷까지 하면 더 받고요</h2>' +
        '<p class="lead">U+투게더 결합은 휴대폰끼리만 모여도 회선마다 요금이 내려가요. 여기에 인터넷을 더하면 인터넷도 할인되고 사은품도 드려요.</p>' +
      '</div>' +
      '<p class="hook"><b class="num" style="color:' + hex + '">80만원</b>' +
        '<span>인터넷을 같이 바꾸시면<br>지원해 드려요</span></p>' +
      '</div></div>';
    wrap.appendChild(d);
  });
</script>
</body>
</html>
